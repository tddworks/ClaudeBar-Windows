name: WSL probe (spike)

# The spike for docs/plans/2026-11-03-wsl-design.md: linux/ built for Linux,
# statically with the Swift Static Linux SDK (musl) and, to compare, against
# glibc. Runs on the spike branch only; the binaries are artifacts.

on:
  push:
    branches: [spike/wsl-probe]
    paths: ['linux/**', 'native/Sources/ClaudeBarWindows/**', '.github/workflows/wsl-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: claudebar-probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: swift:6.3.3-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musl-x86_64
            sdk: x86_64-swift-linux-musl
          - name: musl-aarch64
            sdk: aarch64-swift-linux-musl
          - name: glibc-x86_64
            sdk: ''
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Tools
        run: |
          apt-get update -q && apt-get install -yq curl zip file binutils
          swift --version

      - name: Install the Static Linux SDK
        if: matrix.sdk != ''
        run: |
          curl -fsSL -o /tmp/sdk.tar.gz https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
          sha256sum /tmp/sdk.tar.gz
          swift sdk install /tmp/sdk.tar.gz
          swift sdk list

      - name: Resolve
        run: swift package resolve --package-path linux

      # Glibc-only code, in two packages, patched in their checkouts instead of
      # moving ClaudeBar's pins. musl's C module is Musl:
      # - SwiftTerm 1.12.0, which ClaudeBar pins exactly, imports Glibc on any
      #   Linux. SwiftTerm 1.16.0 fixed it upstream (#612).
      # - ClaudeBar's process code checks `canImport(Glibc)` (so under musl the
      #   pty and the child's teardown would compile to nothing), calls
      #   `Glibc.open` and `Glibc.read`, and reads siginfo_t's glibc fields.
      - name: Patch the Glibc code for musl
        if: matrix.sdk != ''
        run: |
          files=$(grep -rl 'Glibc' linux/.build/checkouts/SwiftTerm/Sources linux/.build/checkouts/ClaudeBar/Modules/*/Sources)
          for file in $files; do
            sed -i -e 's/canImport(Glibc)/(canImport(Glibc) || canImport(Musl))/g' \
                   -e 's/^import Glibc$/#if canImport(Musl)\nimport Musl\n#else\nimport Glibc\n#endif/' \
                   -e 's/Glibc\.\(open\|read\)(/Musl.\1(/g' \
                   -e 's/_sifields\._sigchld\.si_pid/__si_fields.__si_common.__first.__piduid.si_pid/g' \
                   -e 's/_sifields\._sigchld\.si_status/__si_fields.__si_common.__second.__sigchld.si_status/g' "$file"
            echo "patched $file"
          done

      - name: Build
        run: |
          start=$(date +%s)
          if [ -n "${{ matrix.sdk }}" ]; then
            swift build -c release --package-path linux --product claudebar-probe --swift-sdk ${{ matrix.sdk }}
          else
            swift build -c release --package-path linux --product claudebar-probe --static-swift-stdlib
          fi
          echo "build seconds: $(( $(date +%s) - start ))"

      # The probe is the executable and its packages' resource bundles (the
      # provider definitions are one), which Bundle.module finds beside it.
      - name: Measure
        run: |
          bin=$(find linux/.build -path '*release/claudebar-probe' -type f | head -1)
          release=$(dirname "$bin")
          echo "binary: $bin"
          mkdir -p out/claudebar-probe
          cp "$bin" out/claudebar-probe/claudebar-probe
          cp -R "$release"/*.resources out/claudebar-probe/
          file out/claudebar-probe/claudebar-probe
          echo "raw binary bytes: $(stat -c %s out/claudebar-probe/claudebar-probe)"
          strip out/claudebar-probe/claudebar-probe 2>/dev/null || echo "strip: not for this architecture"
          echo "stripped binary bytes: $(stat -c %s out/claudebar-probe/claudebar-probe)"
          echo "resource bundles: $(ls -d out/claudebar-probe/*.resources | wc -l), $(du -cb out/claudebar-probe/*.resources | tail -1 | cut -f1) bytes"
          (cd out && zip -9 -q -r probe.zip claudebar-probe && echo "zipped folder bytes: $(stat -c %s probe.zip)")
          echo "shared libraries:"
          readelf -d out/claudebar-probe/claudebar-probe | grep NEEDED || echo "none"

      - name: Run on the runner
        if: matrix.name != 'musl-aarch64'
        run: |
          mv linux/.build linux/.build-moved
          out/claudebar-probe/claudebar-probe --where
          out/claudebar-probe/claudebar-probe --json

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claudebar-probe-${{ matrix.name }}
          path: out/claudebar-probe
