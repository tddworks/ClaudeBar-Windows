name: Windows client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Build and test Windows client
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # A tag's build checks the tag is on main, which needs main's history.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}

      # A release is only ever a commit main has: a tag on an unmerged branch
      # would otherwise pass every check below and be published.
      - name: Check the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error 'the tagged commit is not on main'; exit 1 }

      # A release is named by its tag, and the app names itself by Client.version
      # (the X-Client header, the window) and the csproj's Version (the exe's file
      # version). All three must agree before anything is built.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = '${{ github.ref_name }}'.Substring(1)
          $client = [regex]::Match((Get-Content -Raw native/Sources/ClaudeBarWindows/Client.swift), 'static let version = "([^"]+)"').Groups[1].Value
          $project = ([xml](Get-Content -Raw app/ClaudeBar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "tag $tag, Client.version $client, csproj $project"
          if ($tag -ne $client -or $tag -ne $project) { Write-Error 'the tag, Client.version and the csproj Version differ'; exit 1 }

      # Match the toolchain used by ClaudeBar's Windows package CI.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Toolchain versions
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # build.ps1 loads MSVC into this process's environment. Keep the tests
      # in the same step, so SwiftPM uses that environment too.
      - name: Build app and test Swift client
        run: |
          & .\build.ps1
          if (-not $?) { exit 1 }
          swift test --package-path native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The app's own tests: its pure C# (where the HUD sits, what it says),
      # compiled without WinUI, so they need no Windows App SDK.
      - name: Test the app's C#
        run: |
          dotnet test tests/ClaudeBar.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The published app, without debug symbols, for the release job.
      - name: Keep the app for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Get-ChildItem out/win-x64 -Recurse -Filter *.pdb | Remove-Item

      - name: Upload the app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClaudeBar-win-x64
          path: out/win-x64
          if-no-files-found: error
          retention-days: 7

      # Velopack's installer and update packages (docs/plans/2026-11-02-updates-design.md):
      # Setup.exe, the full package, and a delta from the last Velopack release,
      # whose full package `vpk download` fetches as the delta's base. The job's
      # token only reads the public releases. A PR or main packs too, under a
      # version no release has and without a delta, so a release never meets vpk first.
      - name: Pack the installer and the update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install --tool-path .vpk vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $version = '${{ github.ref_name }}'.Substring(1)
            .vpk/vpk.exe download github --repoUrl 'https://github.com/${{ github.repository }}' --token $env:GH_TOKEN --pre --channel win --outputDir releases
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $project = ([xml](Get-Content -Raw app/ClaudeBar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$project-ci.${{ github.run_number }}"
          }
          .vpk/vpk.exe pack --packId ClaudeBarWindows --packVersion $version --packDir out/win-x64 --mainExe ClaudeBar.exe `
            --packTitle ClaudeBar --packAuthors 'ClaudeBar for Windows' --icon app/Assets/ClaudeBar.ico `
            --shortcuts StartMenuRoot --noPortable --channel win --runtime win-x64 --outputDir releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only this release's files go on: the last release's package was the delta's base.
          $assets = @((Get-Content -Raw releases/assets.win.json | ConvertFrom-Json).RelativeFileName) + 'assets.win.json'
          Get-ChildItem releases -File | Where-Object { $assets -notcontains $_.Name } | Remove-Item
          Get-ChildItem releases -File | ForEach-Object { '{0}  {1:N0} bytes' -f $_.Name, $_.Length }

      - name: Upload the update packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClaudeBar-velopack
          path: releases
          if-no-files-found: error
          retention-days: 7

  # Only a tag publishes, and only this job can write to the repo: the build
  # above never holds a token that can.
  release:
    name: Publish the pre-release
    needs: client
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClaudeBar-win-x64
          path: ClaudeBar

      - name: Download the update packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ClaudeBar-velopack
          path: releases

      # For the zip install, kept while people move to Setup.exe. One folder in
      # the zip, so extracting it gives ClaudeBar\ClaudeBar.exe.
      - name: Zip it
        run: |
          zip_name="ClaudeBar-Windows-${GITHUB_REF_NAME#v}-x64.zip"
          zip -q -r -X "$zip_name" ClaudeBar
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"

      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # vpk makes the release as a draft, which the app's update check can't
      # see, uploads the installer and the packages, and adds releases.win.json
      # (what the app reads) and the legacy RELEASES. A rerun after a failure
      # here or below finds this tag's draft, which vpk won't add to, so the
      # draft goes first; a published release is never deleted.
      - name: Upload the installer and the packages to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          dotnet tool install --tool-path .vpk vpk --version 1.2.161
          .vpk/vpk upload github --repoUrl "https://github.com/$GH_REPO" --token "$GH_TOKEN" --channel win --pre \
            --tag "$GITHUB_REF_NAME" --releaseName "ClaudeBar for Windows $GITHUB_REF_NAME (preview)" --outputDir releases

      # Every file the release has gets its SHA-256 beside it, read back from
      # the release itself; only then is it published.
      - name: Add the zip and every file's SHA-256, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$ZIP"
          mkdir published
          gh release download "$GITHUB_REF_NAME" --dir published
          cd published
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          cat ./*.sha256
          gh release upload "$GITHUB_REF_NAME" ./*.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease \
            --title "ClaudeBar for Windows $GITHUB_REF_NAME (preview)" \
            --notes "The Leaderboard client, x64, not code-signed. Install it with \`ClaudeBarWindows-win-Setup.exe\`; once installed, it updates itself from Settings. \`$ZIP\` is the same app for a manual install. How to install, update and remove it: [README](https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/README.md#install-a-release). Each file has its SHA-256 beside it (\`<file>.sha256\`); compare it with \`Get-FileHash\`."
